name: 'Route Protection Check'
description: 'Warns on a pull request when a route stops matching its recorded protection intent, such as a removed auth check.'
author: 'zafrem'
branding:
  icon: 'shield'
  color: 'gray-dark'

inputs:
  path:
    description: 'Folder to check, relative to the repository root.'
    required: false
    default: '.'
  base:
    description: 'Git ref to compare against. Defaults to origin/<the pull request target branch>. The checkout needs fetch-depth: 0.'
    required: false
    default: ''
  strict:
    description: 'Fail the job on any finding (true or false).'
    required: false
    default: 'true'

outputs:
  findings:
    description: 'Total number of findings.'
    value: ${{ steps.check.outputs.findings }}
  errors:
    description: 'Findings reported as errors (auth-removed, policy-downgrade, base-unresolved).'
    value: ${{ steps.check.outputs.errors }}
  warnings:
    description: 'Findings reported as warnings (everything else).'
    value: ${{ steps.check.outputs.warnings }}
  routes:
    description: 'Number of routes checked.'
    value: ${{ steps.check.outputs.routes }}

runs:
  using: 'composite'
  steps:
    - name: Run route-protection-intent check
      id: check
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_STRICT: ${{ inputs.strict }}
        BASE_REF: ${{ github.base_ref }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        base="$INPUT_BASE"
        if [ -z "$base" ] && [ -n "$BASE_REF" ]; then base="origin/$BASE_REF"; fi
        args=("$INPUT_PATH" --format github --github-output)
        if [ -n "$base" ]; then args+=(--base "$base"); fi
        if [ "$INPUT_STRICT" = "true" ]; then args+=(--strict); fi
        node "$ACTION_PATH/bin/route-protection-intent.js" check "${args[@]}"
