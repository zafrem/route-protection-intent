name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  bundle:
    name: Plugin bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run bundle
      - name: Fail if the bundled CLI differs from src/
        run: git diff --exit-code -- plugins/route-protection-intent/cli

  validate:
    name: Claude Code plugin and marketplace validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Pinned so a new Claude Code release cannot break CI by itself. Bump it on purpose.
      - run: npm install -g @anthropic-ai/claude-code@2.1.311
      - run: claude plugin validate plugins/route-protection-intent
      - run: claude plugin validate .
