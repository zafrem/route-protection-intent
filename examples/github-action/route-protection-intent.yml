# Copy to .github/workflows/route-protection-intent.yml in your project.
# Warns on the pull request when a route's code no longer matches its recorded protection intent,
# for example when an authentication check is removed from a route whose sidecar says it is protected.
name: route-protection-intent
on: pull_request

permissions:
  contents: read

env:
  # The route-protection-intent release to run. Pinned so a change upstream cannot alter your CI.
  # Move it to a newer tag on purpose, after reading its changelog.
  ROUTE_PROTECTION_INTENT_REF: v0.1.3

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the base commit is needed to compare against
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch route-protection-intent
        run: |
          git clone --quiet https://github.com/zafrem/route-protection-intent "$RUNNER_TEMP/route-protection-intent"
          git -C "$RUNNER_TEMP/route-protection-intent" checkout --quiet "$ROUTE_PROTECTION_INTENT_REF"
      # Use "check ." when the app is at the repository root, or "check apps/web" for a subfolder.
      - run: node "$RUNNER_TEMP/route-protection-intent/bin/route-protection-intent.js" check . --base "origin/${{ github.base_ref }}" --format github --strict
