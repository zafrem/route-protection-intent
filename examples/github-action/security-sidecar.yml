# Copy to .github/workflows/security-sidecar.yml in your project.
# Warns on the pull request when a route's code no longer matches its recorded protection intent,
# for example when an authentication check is removed from a route whose sidecar says it is protected.
name: security-sidecar
on: pull_request

permissions:
  contents: read

env:
  # The security-sidecar commit to run. Pinned so a change upstream cannot alter your CI.
  # Review the commit you pin, and move it on purpose.
  SECURITY_SIDECAR_REF: 8f6360a42e8db1f4df37475729317421655344a1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the base commit is needed to compare against
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch security-sidecar
        run: |
          git clone --quiet https://github.com/zafrem/security-sidecar "$RUNNER_TEMP/security-sidecar"
          git -C "$RUNNER_TEMP/security-sidecar" checkout --quiet "$SECURITY_SIDECAR_REF"
      # Use "check ." when the app is at the repository root, or "check apps/web" for a subfolder.
      - run: node "$RUNNER_TEMP/security-sidecar/bin/security-sidecar.js" check . --base "origin/${{ github.base_ref }}" --format github --strict
